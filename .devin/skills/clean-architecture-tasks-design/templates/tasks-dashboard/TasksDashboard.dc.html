<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Tasks app screen" description="Dashboard screen of the Clean Architecture tasks app: header, greeting, stats, recent tasks, progress" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div data-theme="{{ theme }}" style="min-height:100vh;background:var(--bg-default);color:var(--text-primary);font-family:var(--font-body)">
<x-import component-from-global-scope="CleanArchitectureTasksDesignSystem_40f78d.AppHeader" active="dashboard" user-name="Rakesh James Patole" theme="{{ theme }}" on-toggle-theme="{{ toggleTheme }}" hint-size="100%,65px"></x-import>
<main style="max-width:1264px;margin:0 auto;padding:44px 32px 72px;display:flex;flex-direction:column;gap:32px">
<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
<div>
<div style="font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-secondary)">Monday, 19 October</div>
<h1 style="margin:10px 0 8px;font-family:var(--font-display);font-size:42px;font-weight:700;letter-spacing:-0.02em;line-height:1.1">Good evening, Rakesh</h1>
<p style="margin:0;font-size:15px;color:var(--text-secondary)">1 task is due today and 8 are still to do.</p>
</div>
<x-import component-from-global-scope="CleanArchitectureTasksDesignSystem_40f78d.Button" start-icon="plus" hint-size="130px,42px">New task</x-import>
</div>
<div style="display:flex;flex-wrap:wrap;gap:16px">
<x-import component-from-global-scope="CleanArchitectureTasksDesignSystem_40f78d.StatCard" label="Completed" value="5" tone="done" caption="31% of all tasks" style="flex:1 1 240px" hint-size="100%,150px"></x-import>
<x-import component-from-global-scope="CleanArchitectureTasksDesignSystem_40f78d.StatCard" label="In progress" value="3" tone="inprogress" caption="2 due this week" style="flex:1 1 240px" hint-size="100%,150px"></x-import>
<x-import component-from-global-scope="CleanArchitectureTasksDesignSystem_40f78d.StatCard" label="To do" value="8" tone="todo" caption="1 due today" caption-tone="amber" style="flex:1 1 240px" hint-size="100%,150px"></x-import>
</div>
<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
<div style="flex:1 1 520px;min-width:0;background:var(--bg-paper);border:1px solid var(--border-card);border-radius:20px;box-shadow:var(--shadow-card)">
<div style="display:flex;align-items:center;justify-content:space-between;padding:22px 24px 14px">
<h2 style="margin:0;font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-0.01em">Recent tasks</h2>
<a href="#" style="font-size:14px;font-weight:600;color:var(--primary-soft);text-decoration:none">View all →</a>
</div>
<sc-for list="{{ tasks }}" as="t" hint-placeholder-count="4">
<x-import component-from-global-scope="CleanArchitectureTasksDesignSystem_40f78d.TaskRow" task="{{ t }}" divider="{{ t.divider }}" on-toggle="{{ toggle }}" hint-size="100%,100px"></x-import>
</sc-for>
</div>
<div style="flex:1 0 300px;max-width:360px;background:var(--bg-paper);border:1px solid var(--border-card);border-radius:20px;box-shadow:var(--shadow-card);padding:24px">
<h2 style="margin:0;font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-0.01em">Overall progress</h2>
<div style="display:flex;align-items:baseline;gap:8px;margin:16px 0 18px">
<span style="font-family:var(--font-display);font-size:36px;font-weight:700;letter-spacing:-0.02em;line-height:1">31%</span>
<span style="font-size:14px;color:var(--text-secondary)">of 16 tasks done</span>
</div>
<x-import component-from-global-scope="CleanArchitectureTasksDesignSystem_40f78d.ProgressBar" legend="{{ true }}" segments="{{ segments }}" hint-size="100%,110px"></x-import>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'light'&quot;}}">
class Component extends DCLogic {
  state = { theme: null, done: {} };
  renderVals() {
    const theme = this.state.theme || this.props.theme || 'dark';
    const base = [
      { id: 1, title: 'Write API docs for task endpoints', description: 'Document the REST routes and example payloads.', status: 'To do', priority: 'High', dueLabel: 'Today', dueToday: true },
      { id: 2, title: 'Review pull request #42', description: 'Auth middleware refactor in the Node service.', status: 'In progress', priority: 'Medium', dueLabel: 'Tomorrow' },
      { id: 3, title: 'Set up MUI theme tokens', description: 'Move palette and typography into createTheme.', status: 'To do', priority: 'Medium', dueLabel: 'Wed, 21 Oct' },
      { id: 4, title: 'Update README', description: 'Add run instructions for client and server.', status: 'To do', priority: 'Low', dueLabel: 'Fri, 23 Oct' },
    ];
    const tasks = base.map((t, i) => ({ ...t, divider: i > 0, status: this.state.done[t.id] ? 'Done' : t.status }));
    return {
      theme, tasks,
      segments: [{ label: 'Completed', value: 5 }, { label: 'In progress', value: 3 }, { label: 'To do', value: 8 }],
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }),
      toggle: (t) => this.setState(s => ({ done: { ...s.done, [t.id]: !s.done[t.id] } })),
    };
  }
}
</script>
</body>
</html>
