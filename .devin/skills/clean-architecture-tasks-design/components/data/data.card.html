<body><div id="root"></div><script type="text/babel">
const NS = window.CleanArchitectureTasksDesignSystem_40f78d;
const { StatCard, ProgressBar, TaskRow, Card } = NS;
function Demo({ theme }) {
const [done,setDone]=React.useState(false);
const rows=[{id:1,title:'Write API docs for task endpoints',description:'Document the REST routes and example payloads.',status:'To do',priority:'High',dueLabel:'Today',dueToday:true},{id:2,title:'Fix login redirect bug',description:'Users landed on a blank page after sign in.',status:'Done',priority:'High',dueLabel:'16 Oct'}];

<Card padding={0}><TaskRow divider={false} task={{...rows[0],status:done?'Done':'To do'}} onToggle={()=>setDone(!done)} /></Card>
<Card padding={20}><ProgressBar legend segments={[{label:'Completed',value:5},{label:'In progress',value:3},{label:'To do',value:8}]} /></Card>
</>;
}
const themes = ["dark"];
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'block'}}>{themes.map(t => <div key={t} data-theme={t} className="pane" style={{flex:1}}><Demo theme={t} /></div>)}</div>);
