<!-- @dsCard group="Colors" viewport="700x150" name="Priority chips" subtitle="Text on tint; 6px dot in text color" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.cols{display:grid;grid-template-columns:1fr 1fr}.col{padding:16px 18px;display:flex;flex-direction:column;gap:8px}.th{font:600 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:2px}.sw{display:flex;align-items:center;gap:10px}.chip{width:34px;height:24px;border-radius:7px;border:1px solid var(--border-card);flex-shrink:0}.n{font:500 12px/1.2 var(--font-body);color:var(--text-primary)}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-secondary)}</style></head><body><div class="cols"><div class="col" data-theme="dark" style="background:var(--bg-paper)"><div class="th">dark</div><div style="display:flex;gap:8px;flex-wrap:wrap"><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-high-bg);color:var(--chip-high-fg);font:500 12px/1 var(--font-body)"><span style="width:6px;height:6px;border-radius:999px;background:currentColor"></span>High</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-medium-bg);color:var(--chip-medium-fg);font:500 12px/1 var(--font-body)"><span style="width:6px;height:6px;border-radius:999px;background:currentColor"></span>Medium</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-low-bg);color:var(--chip-low-fg);font:500 12px/1 var(--font-body)"><span style="width:6px;height:6px;border-radius:999px;background:currentColor"></span>Low</span></div><div class="v">high: #FF9E8C on rgba(255,143,122,0.14)<br>medium: #F6C177 on rgba(244,184,96,0.14)<br>low: #7FDCCB on rgba(111,211,195,0.14)</div></div><div class="col" data-theme="light" style="background:var(--bg-paper)"><div class="th">light</div><div style="display:flex;gap:8px;flex-wrap:wrap"><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-high-bg);color:var(--chip-high-fg);font:500 12px/1 var(--font-body)"><span style="width:6px;height:6px;border-radius:999px;background:currentColor"></span>High</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-medium-bg);color:var(--chip-medium-fg);font:500 12px/1 var(--font-body)"><span style="width:6px;height:6px;border-radius:999px;background:currentColor"></span>Medium</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-low-bg);color:var(--chip-low-fg);font:500 12px/1 var(--font-body)"><span style="width:6px;height:6px;border-radius:999px;background:currentColor"></span>Low</span></div><div class="v">high: #B4321F on #FDE8E4<br>medium: #8A5A00 on #FDF0D5<br>low: #0B6B5E on #DDF3EF</div></div></div></body></html>
