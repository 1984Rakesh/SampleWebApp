<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.cols{display:grid;grid-template-columns:1fr 1fr}.col{padding:16px 18px;display:flex;flex-direction:column;gap:8px}.th{font:600 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:2px}.sw{display:flex;align-items:center;gap:10px}.chip{width:34px;height:24px;border-radius:7px;border:1px solid var(--border-card);flex-shrink:0}.n{font:500 12px/1.2 var(--font-body);color:var(--text-primary)}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-secondary)}</style></head><body><div class="cols"><div class="col" data-theme="dark"><div class="th">dark</div><div class="sw"><span class="chip" style="background:var(--bg-default)"></span><div><div class="n">--bg-default</div><div class="v">#0A0D13</div></div></div><div class="sw"><span class="chip" style="background:var(--bg-header)"></span><div><div class="n">--bg-header</div><div class="v">#0D1118</div></div></div><div class="sw"><span class="chip" style="background:var(--bg-paper)"></span><div><div class="n">--bg-paper</div><div class="v">#11151D</div></div></div><div class="sw"><span class="chip" style="background:var(--bg-inset)"></span><div><div class="n">--bg-inset</div><div class="v">#0D1118</div></div></div><div class="sw"><span class="chip" style="background:var(--bg-segmented)"></span><div><div class="n">--bg-segmented</div><div class="v">#0D1118</div></div></div><div class="sw"><span class="chip" style="background:var(--bg-readonly)"></span><div><div class="n">--bg-readonly</div><div class="v">#0D1118</div></div></div></div><div class="col" data-theme="light"><div class="th">light</div><div class="sw"><span class="chip" style="background:var(--bg-default)"></span><div><div class="n">--bg-default</div><div class="v">#F5F6FA</div></div></div><div class="sw"><span class="chip" style="background:var(--bg-header)"></span><div><div class="n">--bg-header</div><div class="v">#FFFFFF</div></div></div><div class="sw"><span class="chip" style="background:var(--bg-paper)"></span><div><div class="n">--bg-paper</div><div class="v">#FFFFFF</div></div></div><div class="sw"><span class="chip" style="background:var(--bg-inset)"></span><div><div class="n">--bg-inset</div><div class="v">#FFFFFF</div></div></div><div class="sw"><span class="chip" style="background:var(--bg-segmented)"></span><div><div class="n">--bg-segmented</div><div class="v">#F0F2F7</div></div></div><div class="sw"><span class="chip" style="background:var(--bg-readonly)"></span><div><div class="n">--bg-readonly</div><div class="v">#F0F2F7</div></div></div></div></div></body></html>
