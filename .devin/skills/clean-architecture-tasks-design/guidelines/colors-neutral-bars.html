ackground:var(--checkbox-ring)"></span><div><div class="n">--checkbox-ring</div><div class="v">#8A94A8</div></div></div><div class="sw"><span class="chip" style="background:var(--bar-in-progress)"></span><div><div class="n">--bar-in-progress</div><div class="v">#4655D4</div></div></div><div class="sw"><span class="chip" style="background:var(--bar-todo)"></span><div><div class="n">--bar-todo</div><div class="v">#8C96AA</div></div></div></div></div></body></html>
