<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="--space-1 … --space-8 (4–32px)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0}</style></head><body><div data-theme="dark" style="padding:20px 24px;display:flex;gap:22px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--primary);border-radius:3px"></div><div style="font:11px ui-monospace,monospace;color:var(--text-secondary)">4px</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--primary);border-radius:3px"></div><div style="font:11px ui-monospace,monospace;color:var(--text-secondary)">8px</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--primary);border-radius:3px"></div><div style="font:11px ui-monospace,monospace;color:var(--text-secondary)">12px</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--primary);border-radius:3px"></div><div style="font:11px ui-monospace,monospace;color:var(--text-secondary)">16px</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--primary);border-radius:3px"></div><div style="font:11px ui-monospace,monospace;color:var(--text-secondary)">20px</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--primary);border-radius:3px"></div><div style="font:11px ui-monospace,monospace;color:var(--text-secondary)">24px</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:var(--space-7);height:var(--space-7);background:var(--primary);border-radius:3px"></div><div style="font:11px ui-monospace,monospace;color:var(--text-secondary)">28px</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--primary);border-radius:3px"></div><div style="font:11px ui-monospace,monospace;color:var(--text-secondary)">32px</div></div></div></body></html>
