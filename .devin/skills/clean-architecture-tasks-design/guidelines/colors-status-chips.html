<!-- @dsCard group="Colors" viewport="700x150" name="Status chips" subtitle="Also used for stat-card icon tiles" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.cols{display:grid;grid-template-columns:1fr 1fr}.col{padding:16px 18px;display:flex;flex-direction:column;gap:8px}.th{font:600 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:2px}.sw{display:flex;align-items:center;gap:10px}.chip{width:34px;height:24px;border-radius:7px;border:1px solid var(--border-card);flex-shrink:0}.n{font:500 12px/1.2 var(--font-body);color:var(--text-primary)}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-secondary)}</style></head><body><div class="cols"><div class="col" data-theme="dark" style="background:var(--bg-paper)"><div class="th">dark</div><div style="display:flex;gap:8px;flex-wrap:wrap"><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-todo-bg);color:var(--chip-todo-fg);font:500 12px/1 var(--font-body)">To do</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-inprogress-bg);color:var(--chip-inprogress-fg);font:500 12px/1 var(--font-body)">In progress</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-done-bg);color:var(--chip-done-fg);font:500 12px/1 var(--font-body)">Done</span></div><div class="v">todo: #B5BDCC on #1E2430<br>inprogress: #A9B7FF on rgba(140,158,255,0.16)<br>done: #8FE3A8 on rgba(111,214,140,0.14)</div></div><div class="col" data-theme="light" style="background:var(--bg-paper)"><div class="th">light</div><div style="display:flex;gap:8px;flex-wrap:wrap"><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-todo-bg);color:var(--chip-todo-fg);font:500 12px/1 var(--font-body)">To do</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-inprogress-bg);color:var(--chip-inprogress-fg);font:500 12px/1 var(--font-body)">In progress</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip-done-bg);color:var(--chip-done-fg);font:500 12px/1 var(--font-body)">Done</span></div><div class="v">todo: #4A5468 on #EBEDF2<br>inprogress: #3745B8 on #E6E9FC<br>done: #1B6B3A on #DDF3E4</div></div></div></body></html>
