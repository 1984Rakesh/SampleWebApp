anger-border</div><div class="v">#F0C9C3</div></div></div><div class="sw"><span class="chip" style="background:var(--done)"></span><div><div class="n">--done</div><div class="v">#3FA663</div></div></div><div class="sw"><span class="chip" style="background:var(--amber-text)"></span><div><div class="n">--amber-text</div><div class="v">#8A5A00</div></div></div><div class="sw"><span class="chip" style="background:var(--selected-nav)"></span><div><div class="n">--selected-nav</div><div class="v">#E9ECFA</div></div></div><div class="sw"><span class="chip" style="background:var(--selected-tab)"></span><div><div class="n">--selected-tab</div><div class="v">#E9ECFA</div></div></div></div></div></body></html>
