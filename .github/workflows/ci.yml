name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Whitespace check against PR base
        if: github.event_name == 'pull_request'
        working-directory: .
        run: git diff --check HEAD^1 HEAD

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint

  server:
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # server/tests/client-contract.test.ts imports client code.
      - name: npm ci (client)
        working-directory: client
        run: npm ci
      - name: npm ci (server)
        run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:startup
